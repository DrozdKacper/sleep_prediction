<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sleep Disorder Prediction</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        label { display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 8px; margin-top: 4px; }
        button { margin-top: 20px; padding: 10px 20px; }
        #result { margin-top: 20px; font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
    <h1>Sleep Disorder Prediction</h1>
    <form id="sleepForm">
        <label>Age: <input type="number" name="Age" required></label>
        <label>BMI: <input type="number" step="0.1" name="BMI" required></label>
        <label>Systolic: <input type="number" name="Systolic" required></label>
        <label>Diastolic: <input type="number" name="Diastolic" required></label>
        <label>Gender:
            <select name="Gender" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </label>
        <label>Occupation: <input type="text" name="Occupation" required></label>
        <label>Sleep Duration: <input type="number" step="0.1" name="Sleep_Duration" required></label>
        <label>Physical Activity Level: <input type="number" name="Physical_Activity_Level" required></label>
        <label>Stress Level: <input type="number" name="Stress_Level" required></label>
        <label>Heart Rate: <input type="number" name="Heart_Rate" required></label>
        <label>Daily Steps: <input type="number" name="Daily_Steps" required></label>
        <label>BMI Category:
            <select name="BMI_Category" required>
                <option value="Normal">Normal</option>
                <option value="Overweight">Overweight</option>
                <option value="Obese">Obese</option>
            </select>
        </label>
        <button type="submit">Predict</button>
    </form>
    <div id="result"></div>

    <script>
        const form = document.getElementById('sleepForm');
        const resultDiv = document.getElementById('result');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const data = {};
            formData.forEach((value, key) => data[key] = isNaN(value) ? value : Number(value));

            try {
                const response = await fetch('https://sleep-prediction-oz9l.onrender.com/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                resultDiv.innerText = "Predicted Sleep Disorder: " + result.predicted_sleep_disorder;
            } catch (err) {
                resultDiv.innerText = "Error: " + err.message;
            }
        });
    </script>
</body>
</html>
